            <form class="space-y-4">

                <input class="block w-full h-7.5 border bg-white text-black border-white p-1.25 outline-none" type="email" placeholder="Enter Your Email" id="email">
                <input class="block w-full h-7.5 border bg-white text-black border-white p-1.25 outline-none" type="password" placeholder="Enter Your password" id="password">
                <div class="text-white">
            <input type="checkbox" id="remember_me" class="ml-2 accent-orange-700">
             <label for="remember_me" class="ml-2">Remember Me</label>
        </div>
                <input class="block w-full h-7.5 border border-white p-1.25 outline-none bg-white hover:bg-opacity-5 cursor-pointer hover:bg-[#9B2226]"  type="submit" value="Sign Up" id="sign_up">
